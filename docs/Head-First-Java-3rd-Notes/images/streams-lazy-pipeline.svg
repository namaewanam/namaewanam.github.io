<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="860" height="360" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Java Stream API Pipeline &amp; Lazy Evaluation (Đánh giá lười)</text>

  <!-- Source -->
  <rect x="35" y="75" width="165" height="135" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="117" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">1. Data Source</text>
  <text x="117" y="128" text-anchor="middle" font-size="12" font-family="monospace" fill="#1e3a8a">songs.stream()</text>
  <text x="117" y="155" text-anchor="middle" font-size="11" fill="#1d4ed8">Không làm thay đổi</text>
  <text x="117" y="173" text-anchor="middle" font-size="11" fill="#1d4ed8">Collection gốc</text>

  <line x1="200" y1="142" x2="235" y2="142" stroke="#334155" stroke-width="2.5"/>

  <!-- Intermediate Ops -->
  <rect x="235" y="65" width="380" height="155" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="425" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">2. Intermediate Operations (LAZY - Chỉ dựng công thức)</text>

  <rect x="252" y="106" width="110" height="90" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="307" y="130" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#92400e">filter(s -&gt; ...)</text>
  <text x="307" y="152" text-anchor="middle" font-size="11" fill="#78350f">Predicate&lt;T&gt;</text>
  <text x="307" y="172" text-anchor="middle" font-size="11" font-family="monospace" fill="#b45309">T ──► boolean</text>

  <rect x="372" y="106" width="110" height="90" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="427" y="130" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#92400e">map(Song::...)</text>
  <text x="427" y="152" text-anchor="middle" font-size="11" fill="#78350f">Function&lt;T,R&gt;</text>
  <text x="427" y="172" text-anchor="middle" font-size="11" font-family="monospace" fill="#b45309">T ──► R</text>

  <rect x="492" y="106" width="105" height="90" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="544" y="130" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#92400e">limit(5)</text>
  <text x="544" y="152" text-anchor="middle" font-size="11" fill="#78350f">Short-circuit</text>
  <text x="544" y="172" text-anchor="middle" font-size="11" fill="#b45309">Đủ 5 là dừng</text>

  <line x1="615" y1="142" x2="650" y2="142" stroke="#334155" stroke-width="2.5"/>

  <!-- Terminal Op -->
  <rect x="650" y="75" width="175" height="135" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="737" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">3. Terminal Op</text>
  <text x="737" y="128" text-anchor="middle" font-size="12" font-family="monospace" font-weight="700" fill="#14532d">.toList() / .count()</text>
  <text x="737" y="155" text-anchor="middle" font-size="11" fill="#15803d">Kích hoạt toàn bộ</text>
  <text x="737" y="173" text-anchor="middle" font-size="11" fill="#15803d">dây chuyền &amp; đóng Stream</text>

  <!-- Loop Fusion Note -->
  <rect x="35" y="242" width="790" height="92" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="430" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Cơ chế Loop Fusion (Gộp vòng lặp theo chiều dọc):</text>
  <text x="430" y="292" text-anchor="middle" font-size="12" fill="#334155">Phần tử #1 đi xuyên qua filter ──► map ──► limit ngay trong 1 lượt duyệt (không tạo List tạm ở mỗi bước).</text>
  <text x="430" y="314" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">Nếu thiếu Terminal Operation ở cuối, toàn bộ các khâu Intermediate sẽ KHÔNG bao giờ được thực thi!</text>
</svg>