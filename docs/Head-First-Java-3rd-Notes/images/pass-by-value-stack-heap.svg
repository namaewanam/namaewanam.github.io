<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="840" height="380" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Java Pass-by-Value (Copy-by-Value): Primitive vs Object Reference</text>

  <!-- Stack -->
  <rect x="35" y="58" width="415" height="295" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="242" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Thread Stack (Các Stack Frame độc lập)</text>

  <!-- Frame modify() -->
  <rect x="55" y="100" width="375" height="105" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="242" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Stack Frame: modify(int xCopy, Account accCopy)</text>
  <text x="75" y="148" font-size="12" font-family="monospace" fill="#78350f">xCopy = 999  (Sửa bản sao, x gốc không đổi)</text>
  <text x="75" y="172" font-size="12" font-family="monospace" fill="#78350f">accCopy = 0x7A00 (Bản sao Remote #2 cùng trỏ 0x7A00)</text>
  <text x="75" y="192" font-size="11" font-weight="600" fill="#b45309">accCopy.balance += 500 ──► Tác động trực tiếp lên Heap!</text>

  <!-- Frame main() -->
  <rect x="55" y="220" width="375" height="110" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="242" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Stack Frame: main()</text>
  <text x="75" y="270" font-size="12" font-family="monospace" fill="#1e3a8a">int x = 10   (Giữ nguyên giá trị 10)</text>
  <text x="75" y="295" font-size="12" font-family="monospace" fill="#1e3a8a">Account acc = 0x7A00 (Remote gốc #1)</text>
  <text x="75" y="316" font-size="11" fill="#1d4ed8">Nếu hàm con gán accCopy = new Account(), acc gốc vẫn trỏ 0x7A00</text>

  <!-- Heap -->
  <rect x="485" y="58" width="320" height="295" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">JVM Heap Memory</text>

  <rect x="515" y="150" width="260" height="120" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Account Object (@0x7A00)</text>
  <text x="645" y="208" text-anchor="middle" font-size="13" font-family="monospace" font-weight="700" fill="#166534">balance: 1000 ──► 1500</text>
  <text x="645" y="236" text-anchor="middle" font-size="11" fill="#15803d">Cả 2 biến tham chiếu acc &amp; accCopy</text>
  <text x="645" y="254" text-anchor="middle" font-size="11" fill="#15803d">đều điều khiển chung Object này</text>

  <!-- Reference arrows -->
  <path d="M 430 168 L 515 195" stroke="#d97706" stroke-width="2.2" stroke-dasharray="5,3"/>
  <path d="M 430 290 L 515 225" stroke="#2563eb" stroke-width="2.2"/>
</svg>