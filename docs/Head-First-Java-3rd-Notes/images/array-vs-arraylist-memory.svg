<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="840" height="380" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Mảng tĩnh (Array) vs ArrayList&lt;E&gt; Dynamic Resizing (1.5x Capacity)</text>

  <!-- Left: Fixed Array -->
  <rect x="35" y="58" width="375" height="295" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="222" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">1. Mảng thường: String[] arr = new String[3]</text>
  <text x="222" y="104" text-anchor="middle" font-size="11" fill="#475569">Kích thước cố định ngay lúc cấp phát — Không thể co giãn</text>

  <rect x="65" y="125" width="315" height="55" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="222" y="157" text-anchor="middle" font-size="13" font-family="monospace" font-weight="700" fill="#334155">[0]: "A"  |  [1]: null  |  [2]: "C"</text>

  <rect x="65" y="200" width="315" height="130" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="222" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Hạn chế khi thao tác thủ công:</text>
  <text x="222" y="248" text-anchor="middle" font-size="11" fill="#7f1d1d">• Xóa phần tử ở giữa để lại lỗ hổng null</text>
  <text x="222" y="270" text-anchor="middle" font-size="11" fill="#7f1d1d">• Phải tự viết vòng lặp kiểm tra chứa phần tử</text>
  <text x="222" y="292" text-anchor="middle" font-size="11" fill="#7f1d1d">• Vượt quá 3 phần tử ném ArrayIndexOutOfBounds</text>
  <text x="222" y="314" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">• Ưu điểm: Lưu trực tiếp Primitive (int[], byte[])</text>

  <!-- Right: ArrayList -->
  <rect x="430" y="58" width="375" height="295" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="617" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">2. ArrayList&lt;String&gt; (Tự động co giãn &amp; dồn ô)</text>
  <text x="617" y="104" text-anchor="middle" font-size="11" fill="#475569">Bọc mảng Object[] bên trong, mặc định Capacity = 10</text>

  <rect x="455" y="125" width="325" height="55" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="617" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Sau lệnh list.remove("B"): Tự động dịch trái</text>
  <text x="617" y="167" text-anchor="middle" font-size="12" font-family="monospace" fill="#1e3a8a">[0]: "A" | [1]: "C" | [2..9]: unused capacity</text>

  <rect x="455" y="200" width="325" height="130" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="617" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Cơ chế Grow (Khi đầy Capacity):</text>
  <text x="617" y="248" text-anchor="middle" font-size="11" font-family="monospace" fill="#14532d">newCapacity = oldCapacity + (oldCapacity &gt;&gt; 1)</text>
  <text x="617" y="270" text-anchor="middle" font-size="11" fill="#14532d">• Tăng gấp ~1.5 lần (10 ──► 15 ──► 22 ──► 33)</text>
  <text x="617" y="292" text-anchor="middle" font-size="11" fill="#14532d">• Copy mảng cũ sang mảng mới qua Arrays.copyOf</text>
  <text x="617" y="314" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">• Đọc ngẫu nhiên get(i) đạt O(1) | Thêm cuối Amortized O(1)</text>
</svg>