<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="840" height="350" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Mô hình Event-Driven GUI &amp; Observer Pattern trong Java Swing</text>

  <!-- Event Source -->
  <rect x="45" y="80" width="235" height="165" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="162" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Event Source (Subject)</text>
  <text x="162" y="132" text-anchor="middle" font-size="13" font-family="monospace" font-weight="700" fill="#1d4ed8">JButton ("Click Me")</text>
  <text x="162" y="160" text-anchor="middle" font-size="11" fill="#1e3a8a">• Giữ danh sách Listeners</text>
  <text x="162" y="182" text-anchor="middle" font-size="11" fill="#1e3a8a">• Khi người dùng nhấn chuột,</text>
  <text x="162" y="200" text-anchor="middle" font-size="11" fill="#1e3a8a">  tạo đối tượng ActionEvent</text>

  <!-- EventListener -->
  <rect x="560" y="80" width="235" height="165" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="677" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Event Listener (Observer)</text>
  <text x="677" y="132" text-anchor="middle" font-size="13" font-family="monospace" font-weight="700" fill="#15803d">ActionListener / Lambda</text>
  <text x="677" y="160" text-anchor="middle" font-size="11" font-family="monospace" fill="#14532d">actionPerformed(ActionEvent e)</text>
  <text x="677" y="185" text-anchor="middle" font-size="11" fill="#166534">• Thực thi logic nghiệp vụ</text>
  <text x="677" y="203" text-anchor="middle" font-size="11" fill="#166534">• Gọi panel.repaint() vẽ lại UI</text>

  <!-- Arrows -->
  <path d="M 560 125 L 280 125" stroke="#2563eb" stroke-width="2.2"/>
  <text x="420" y="114" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#1e40af">1. button.addActionListener(listener)</text>

  <path d="M 280 195 L 560 195" stroke="#16a34a" stroke-width="2.5"/>
  <text x="420" y="184" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#15803d">2. Callback: actionPerformed(event)</text>

  <rect x="45" y="268" width="750" height="58" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="420" y="293" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Quy tắc vàng trên Event Dispatch Thread (EDT):</text>
  <text x="420" y="313" text-anchor="middle" font-size="11" fill="#78350f">Không bao giờ gọi trực tiếp paintComponent(g) (hãy gọi repaint()) và không chạy tác vụ I/O nặng làm treo EDT!</text>
</svg>