<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 370" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="840" height="370" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Class (Bản thiết kế) vs Object Instances (Thực thể trên Garbage-Collected Heap)</text>

  <!-- Left: Class Blueprint -->
  <rect x="35" y="60" width="250" height="275" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Class: Dog.class</text>
  <text x="160" y="108" text-anchor="middle" font-size="11" fill="#1e3a8a">(Bản thiết kế / Khuôn bánh)</text>

  <rect x="55" y="125" width="210" height="85" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="160" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">State (Instance Variables)</text>
  <text x="160" y="168" text-anchor="middle" font-size="12" font-family="monospace" fill="#1e3a8a">int size;</text>
  <text x="160" y="188" text-anchor="middle" font-size="12" font-family="monospace" fill="#1e3a8a">String name, breed;</text>

  <rect x="55" y="225" width="210" height="85" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="160" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Behavior (Methods)</text>
  <text x="160" y="268" text-anchor="middle" font-size="12" font-family="monospace" fill="#1e3a8a">void bark()</text>
  <text x="160" y="288" text-anchor="middle" font-size="12" font-family="monospace" fill="#1e3a8a">void eat()</text>

  <!-- Arrow new Dog() -->
  <line x1="285" y1="195" x2="365" y2="195" stroke="#0f172a" stroke-width="2.5"/>
  <text x="325" y="183" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#0f172a">new Dog()</text>

  <!-- Right: JVM Heap -->
  <rect x="365" y="60" width="440" height="275" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="585" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Garbage-Collected Heap (Bộ nhớ Runtime)</text>

  <rect x="390" y="110" width="185" height="100" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="482" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Dog Object #1 (@0x1A4)</text>
  <text x="482" y="154" text-anchor="middle" font-size="11" font-family="monospace" fill="#166534">size = 70</text>
  <text x="482" y="172" text-anchor="middle" font-size="11" font-family="monospace" fill="#166534">name = "Rex"</text>
  <text x="482" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">bark() ──► "Woof! Woof!"</text>

  <rect x="595" y="110" width="185" height="100" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="687" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Dog Object #2 (@0x2F8)</text>
  <text x="687" y="154" text-anchor="middle" font-size="11" font-family="monospace" fill="#78350f">size = 8</text>
  <text x="687" y="172" text-anchor="middle" font-size="11" font-family="monospace" fill="#78350f">name = "Milo"</text>
  <text x="687" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">bark() ──► "Yip! Yip!"</text>

  <rect x="390" y="230" width="390" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="585" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Nguyên lý cốt lõi OOP:</text>
  <text x="585" y="276" text-anchor="middle" font-size="11" fill="#334155">• Cùng 1 Class nhưng mỗi Object giữ vùng nhớ Instance Variables độc lập.</text>
  <text x="585" y="295" text-anchor="middle" font-size="11" fill="#334155">• Hành vi của Method có thể biến thiên dựa trên trạng thái (State) riêng.</text>
</svg>