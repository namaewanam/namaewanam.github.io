<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="860" height="360" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Ba trình quản lý bố cục (Layout Managers) kinh điển trong Swing</text>

  <!-- 1. BorderLayout -->
  <rect x="30" y="58" width="265" height="275" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="162" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">1. BorderLayout (Mặc định JFrame)</text>

  <rect x="45" y="96" width="235" height="36" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="162" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">NORTH (Cao tự nhiên, Rộng hết)</text>

  <rect x="45" y="138" width="55" height="115" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="72" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">WEST</text>

  <rect x="106" y="138" width="113" height="115" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="162" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">CENTER</text>
  <text x="162" y="210" text-anchor="middle" font-size="10" fill="#14532d">(Phần dư còn lại)</text>

  <rect x="225" y="138" width="55" height="115" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="252" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">EAST</text>

  <rect x="45" y="259" width="235" height="36" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="162" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">SOUTH (Cao tự nhiên, Rộng hết)</text>

  <!-- 2. FlowLayout -->
  <rect x="310" y="58" width="250" height="275" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="435" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">2. FlowLayout (Mặc định JPanel)</text>
  <text x="435" y="102" text-anchor="middle" font-size="11" fill="#475569">Xếp trái sang phải, hết chỗ xuống dòng</text>

  <rect x="330" y="122" width="65" height="36" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="362" y="145" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Btn 1</text>
  <rect x="405" y="122" width="65" height="36" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="437" y="145" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Btn 2</text>
  <rect x="480" y="122" width="60" height="36" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="510" y="145" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Btn 3</text>

  <rect x="365" y="170" width="140" height="36" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="435" y="193" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Btn 4 (Tự xuống dòng)</text>

  <text x="435" y="255" text-anchor="middle" font-size="11" fill="#334155">Tôn trọng trọn vẹn kích thước gốc</text>
  <text x="435" y="273" text-anchor="middle" font-size="11" font-family="monospace" fill="#166534">getPreferredSize()</text>

  <!-- 3. BoxLayout -->
  <rect x="575" y="58" width="255" height="275" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="702" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">3. BoxLayout (Y_AXIS / X_AXIS)</text>
  <text x="702" y="102" text-anchor="middle" font-size="11" fill="#475569">Xếp thẳng đứng hoặc ngang cố định</text>

  <rect x="615" y="122" width="175" height="38" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="702" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">Component 1</text>

  <rect x="615" y="172" width="175" height="38" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="702" y="196" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">Component 2</text>

  <rect x="615" y="222" width="175" height="38" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="702" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">Component 3</text>

  <text x="702" y="295" text-anchor="middle" font-size="11" fill="#78350f">Không tự động rớt dòng khi hẹp cửa sổ</text>
</svg>