<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="840" height="360" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Simple Startup Game Grid (1D Array) &amp; Toán tử ++i vs i++</text>

  <!-- Grid -->
  <rect x="35" y="58" width="770" height="135" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="84" font-size="14" font-weight="700" fill="#0f172a">1. Bàn cờ 1 chiều (7 ô: Index 0..6) — Startup chiếm 3 ô liên tiếp</text>

  <!-- 7 cells -->
  <rect x="60" y="100" width="95" height="65" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="107" y="128" text-anchor="middle" font-size="12" font-family="monospace" fill="#475569">Index 0</text>
  <text x="107" y="150" text-anchor="middle" font-size="11" fill="#64748b">miss</text>

  <rect x="163" y="100" width="95" height="65" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="210" y="128" text-anchor="middle" font-size="12" font-family="monospace" fill="#475569">Index 1</text>
  <text x="210" y="150" text-anchor="middle" font-size="11" fill="#64748b">miss</text>

  <rect x="266" y="100" width="95" height="65" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="313" y="128" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#166534">Index 2</text>
  <text x="313" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">HIT (Cell 1)</text>

  <rect x="369" y="100" width="95" height="65" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="416" y="128" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#166534">Index 3</text>
  <text x="416" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">HIT (Cell 2)</text>

  <rect x="472" y="100" width="95" height="65" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="519" y="128" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#92400e">Index 4</text>
  <text x="519" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">KILL (Cell 3)</text>

  <rect x="575" y="100" width="95" height="65" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="622" y="128" text-anchor="middle" font-size="12" font-family="monospace" fill="#475569">Index 5</text>
  <text x="622" y="150" text-anchor="middle" font-size="11" fill="#64748b">miss</text>

  <rect x="678" y="100" width="95" height="65" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="725" y="128" text-anchor="middle" font-size="12" font-family="monospace" fill="#475569">Index 6</text>
  <text x="725" y="150" text-anchor="middle" font-size="11" fill="#64748b">miss</text>

  <!-- Pre vs Post Increment -->
  <rect x="35" y="210" width="375" height="125" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="222" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Pre-Increment (++i): Tăng trước, Dùng sau</text>
  <text x="222" y="264" text-anchor="middle" font-size="12" font-family="monospace" fill="#1e3a8a">int i = 5; int a = ++i;</text>
  <text x="222" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Kết quả: i = 6, a = 6</text>
  <text x="222" y="314" text-anchor="middle" font-size="11" fill="#1e3a8a">Biến i tăng lên 6 ngay lập tức trước khi gán vào a</text>

  <rect x="430" y="210" width="375" height="125" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="617" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Post-Increment (i++): Dùng trước, Tăng sau</text>
  <text x="617" y="264" text-anchor="middle" font-size="12" font-family="monospace" fill="#78350f">int i = 5; int b = i++;</text>
  <text x="617" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Kết quả: b = 5, i = 6</text>
  <text x="617" y="314" text-anchor="middle" font-size="11" fill="#78350f">Lấy giá trị cũ (5) gán cho b trước, sau đó i mới tăng lên 6</text>
</svg>