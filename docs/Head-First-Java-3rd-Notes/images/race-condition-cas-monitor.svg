<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="860" height="390" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Race Condition (Check-Then-Act) vs Object Monitor Lock &amp; Atomic CAS</text>

  <!-- Left: Race Condition -->
  <rect x="30" y="58" width="400" height="305" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="230" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">1. Race Condition: "Ryan &amp; Monica" (Số dư gốc = 100)</text>

  <rect x="50" y="102" width="360" height="235" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="70" y="130" font-size="12" font-family="monospace" fill="#1e40af">T1 (Ryan)  : Kiểm tra balance (100 &gt;= 100) ──► OK</text>
  <text x="70" y="158" font-size="12" font-family="monospace" fill="#dc2626">             [Thread T1 bị OS tạm dừng chuyển ngữ cảnh]</text>
  <text x="70" y="186" font-size="12" font-family="monospace" fill="#166534">T2 (Monica): Kiểm tra balance (100 &gt;= 100) ──► OK</text>
  <text x="70" y="214" font-size="12" font-family="monospace" fill="#166534">T2 (Monica): Rút 100 ──► balance = 0</text>
  <text x="70" y="242" font-size="12" font-family="monospace" fill="#1e40af">T1 (Ryan)  : Tỉnh dậy rút tiếp 100 ──► balance = -100!</text>
  <line x1="65" y1="265" x2="395" y2="265" stroke="#fca5a5"/>
  <text x="230" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Nguyên nhân: "Kiểm tra" và "Trừ tiền" không nguyên tử</text>
  <text x="230" y="312" text-anchor="middle" font-size="11" fill="#7f1d1d">(Non-Atomic Check-Then-Act &amp; Read-Modify-Write)</text>

  <!-- Right: Solutions -->
  <rect x="450" y="58" width="380" height="305" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="640" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">2. Hai cơ chế đồng bộ hóa chuẩn trong Java</text>

  <!-- synchronized -->
  <rect x="470" y="102" width="340" height="112" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">A. Pessimistic Lock: synchronized / ReentrantLock</text>
  <text x="640" y="148" text-anchor="middle" font-size="11" fill="#1e3a8a">• Mỗi Object có 1 khóa nội tại (Intrinsic Monitor Lock)</text>
  <text x="640" y="168" text-anchor="middle" font-size="11" fill="#1e3a8a">• Chỉ 1 luồng giữ chìa khóa được vào vùng Critical Section</text>
  <text x="640" y="188" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">• Đảm bảo cả Atomicity lẫn Memory Visibility (Happens-Before)</text>

  <!-- CAS -->
  <rect x="470" y="228" width="340" height="112" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="640" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">B. Lock-Free Optimistic: AtomicInteger (CAS)</text>
  <text x="640" y="274" text-anchor="middle" font-size="11" font-family="monospace" fill="#14532d">compareAndSet(expectedValue, newValue)</text>
  <text x="640" y="294" text-anchor="middle" font-size="11" fill="#14532d">• Dùng chỉ thị nguyên tử phần cứng CPU (CMPXCHG)</text>
  <text x="640" y="314" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">• Không chặn luồng (Non-blocking), tránh nguy cơ Deadlock</text>
</svg>