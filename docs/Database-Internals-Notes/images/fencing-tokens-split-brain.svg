<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="860" height="390" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Phòng chống Split-Brain (Zombie Leader) bằng Monotonic Fencing Token</text>

  <!-- Actors -->
  <rect x="45" y="65" width="180" height="75" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="135" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Leader Cũ (Node 1)</text>
  <text x="135" y="112" text-anchor="middle" font-size="12" font-family="monospace" fill="#7f1d1d">Epoch / Token = 33</text>
  <text x="135" y="130" text-anchor="middle" font-size="11" fill="#dc2626">(Bị GC Pause 15 giây)</text>

  <rect x="45" y="235" width="180" height="75" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="135" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Leader Mới (Node 2)</text>
  <text x="135" y="282" text-anchor="middle" font-size="12" font-family="monospace" fill="#14532d">Epoch / Token = 34</text>
  <text x="135" y="300" text-anchor="middle" font-size="11" fill="#15803d">(Được bầu hợp lệ ở Term 34)</text>

  <rect x="555" y="125" width="260" height="145" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="685" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Storage / Resource Server</text>
  <rect x="575" y="170" width="220" height="40" rx="5" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="685" y="195" text-anchor="middle" font-size="13" font-weight="700" font-family="monospace" fill="#1d4ed8">max_seen_token = 34</text>
  <text x="685" y="232" text-anchor="middle" font-size="11" fill="#1e3a8a">Quy tắc: Từ chối mọi lệnh ghi</text>
  <text x="685" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">nếu token &lt; max_seen_token</text>

  <!-- Arrows -->
  <path d="M 225 272 L 550 215" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="385" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">1. Write(data, token=34) ──► OK (Cập nhật max=34)</text>

  <path d="M 225 105 L 550 165" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="395" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">2. Zombie tỉnh dậy gửi Write(data, token=33)</text>
  <text x="395" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">──► REJECTED! (33 &lt; 34: Bảo toàn dữ liệu)</text>

  <text x="430" y="358" text-anchor="middle" font-size="12" fill="#334155">Mọi hệ thống Consensus (Raft Term, Paxos Ballot, ZooKeeper zxid) đều cấp chuỗi số đơn điệu tăng làm Fencing Token</text>
</svg>