<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="860" height="430" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Slotted Page Layout (8 KB Page) &amp; Binary Cell Format</text>

  <!-- Main 8KB Page Box -->
  <rect x="35" y="55" width="790" height="205" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="50" y="78" font-size="13" font-weight="700" fill="#334155" font-family="monospace">Offset 0x0000</text>
  <text x="710" y="78" font-size="13" font-weight="700" fill="#334155" font-family="monospace">Offset 0x2000 (8192B)</text>

  <!-- Page Header -->
  <rect x="48" y="90" width="145" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="120" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Page Header (24B)</text>
  <text x="120" y="135" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="monospace">PageLSN (8B)</text>
  <text x="120" y="152" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="monospace">pd_lower | pd_upper</text>
  <text x="120" y="169" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="monospace">Flags | SlotCount</text>

  <!-- Pointer Array -->
  <rect x="200" y="90" width="195" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="297" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Slot / Pointer Array</text>
  <rect x="210" y="123" width="55" height="32" rx="4" fill="#bbf7d0" stroke="#15803d"/>
  <text x="237" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d" font-family="monospace">Slot 0</text>
  <rect x="270" y="123" width="55" height="32" rx="4" fill="#bbf7d0" stroke="#15803d"/>
  <text x="297" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d" font-family="monospace">Slot 1</text>
  <rect x="330" y="123" width="55" height="32" rx="4" fill="#bbf7d0" stroke="#15803d"/>
  <text x="357" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d" font-family="monospace">Slot 2</text>
  <text x="297" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">pd_lower ──► (Mọc xuôi)</text>

  <!-- Free Space -->
  <rect x="403" y="90" width="160" height="90" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="483" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">Free Space</text>
  <text x="483" y="152" text-anchor="middle" font-size="11" fill="#64748b">(Vùng trống khả dụng)</text>

  <!-- Data Cells -->
  <rect x="571" y="90" width="240" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="691" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Data Cells (Bản ghi thực tế)</text>
  <rect x="581" y="123" width="70" height="32" rx="4" fill="#fde68a" stroke="#b45309"/>
  <text x="616" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f" font-family="monospace">Cell 2</text>
  <rect x="656" y="123" width="70" height="32" rx="4" fill="#fde68a" stroke="#b45309"/>
  <text x="691" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f" font-family="monospace">Cell 1</text>
  <rect x="731" y="123" width="70" height="32" rx="4" fill="#fde68a" stroke="#b45309"/>
  <text x="766" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f" font-family="monospace">Cell 0</text>
  <text x="691" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">◄── pd_upper (Mọc ngược)</text>

  <!-- Pointers from Slots to Cells -->
  <path d="M 237 180 C 237 235, 766 235, 766 180" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="4,3"/>
  <path d="M 297 180 C 297 220, 691 220, 691 180" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="4,3"/>
  <path d="M 357 180 C 357 205, 616 205, 616 180" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="4,3"/>
  <text x="495" y="246" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">Indirection: Đổi chỗ hoặc dọn phân mảnh Cell chỉ cần cập nhật Offset 2B trong Slot</text>

  <!-- Binary Cell Layout Box -->
  <rect x="35" y="280" width="790" height="128" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="55" y="305" font-size="14" font-weight="700" fill="#0f172a">Cấu trúc nhị phân của 1 Data Leaf Cell (Variable-Length Key-Value)</text>

  <rect x="55" y="320" width="120" height="50" rx="5" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="115" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#6b21a8">Flags / NullBmp</text>
  <text x="115" y="360" text-anchor="middle" font-size="11" fill="#581c87" font-family="monospace">1 - 2 Bytes</text>

  <rect x="183" y="320" width="125" height="50" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="245" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Key Size</text>
  <text x="245" y="360" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="monospace">uint16 (2 Bytes)</text>

  <rect x="316" y="320" width="135" height="50" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="383" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Value Size</text>
  <text x="383" y="360" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="monospace">uint32 (4 Bytes)</text>

  <rect x="459" y="320" width="155" height="50" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="536" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Key Bytes</text>
  <text x="536" y="360" text-anchor="middle" font-size="11" fill="#14532d" font-family="monospace">Variable (KeySize B)</text>

  <rect x="622" y="320" width="180" height="50" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="712" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Value Payload</text>
  <text x="712" y="360" text-anchor="middle" font-size="11" fill="#78350f" font-family="monospace">Variable (ValueSize B)</text>

  <text x="430" y="395" text-anchor="middle" font-size="12" fill="#475569">Fixed-Size Fields đứng trước (O(1) offset lookup) ──► Variable-Length Payload đứng sau</text>
</svg>