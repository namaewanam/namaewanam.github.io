<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="860" height="410" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Binary Search trên Indirection Vector &amp; Page Split (Right-Only vs Random)</text>

  <!-- Left panel: Indirection Vector Binary Search -->
  <rect x="30" y="55" width="390" height="330" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="225" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">1. Binary Search trên Slot Array O(log N)</text>
  <text x="225" y="102" text-anchor="middle" font-size="12" fill="#475569">Cell ghi bất kỳ ở cuối trang, nhưng Slot luôn sắp xếp theo Key</text>

  <rect x="55" y="120" width="340" height="68" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="225" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Sorted Slot Array (Mảng Offset 2B)</text>
  <text x="225" y="160" text-anchor="middle" font-size="12" font-family="monospace" fill="#1e3a8a">[0]:off(K=10) | [1]:off(K=20) | [2]:off(K=30) | [3]:off(K=40)</text>
  <text x="225" y="179" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">▲ mid = 1 (So sánh Key=20 trước)</text>

  <rect x="55" y="210" width="340" height="72" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="225" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Unsorted Cell Storage (Cuối trang 8KB)</text>
  <text x="225" y="252" text-anchor="middle" font-size="12" font-family="monospace" fill="#78350f">[Cell K=30]  [Cell K=10]  [Cell K=40]  [Cell K=20]</text>
  <text x="225" y="272" text-anchor="middle" font-size="11" fill="#92400e">Chèn Key=25: Ghi Cell mới vào Free Space + dịch 2 Slot</text>

  <rect x="55" y="300" width="340" height="65" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="225" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Prefix Compression (Nén tiền tố trong trang)</text>
  <text x="225" y="346" text-anchor="middle" font-size="12" font-family="monospace" fill="#14532d">"user:2026:1001", "user:2026:1002" ──► prefix="user:2026:100"</text>

  <!-- Right panel: Page Split Comparison -->
  <rect x="440" y="55" width="390" height="330" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="635" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">2. UUIDv4 (Random) vs Sequential / UUIDv7</text>

  <!-- Random UUIDv4 -->
  <rect x="460" y="102" width="350" height="122" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="635" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">UUIDv4 Ngẫu nhiên: 50/50 Midpoint Split</text>
  <text x="635" y="143" text-anchor="middle" font-size="11" fill="#7f1d1d">Chèn rải đều mọi Leaf Page ──► Nửa trang bị bỏ trống sau khi tách</text>
  <rect x="480" y="155" width="145" height="32" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="552" y="175" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">Leaf A: 50% Full</text>
  <rect x="645" y="155" width="145" height="32" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="717" y="175" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">Leaf B: 50% Full</text>
  <text x="635" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">Occupancy trung bình ~67% | Buffer Pool Miss cao</text>

  <!-- Right-Only Appends -->
  <rect x="460" y="240" width="350" height="125" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="635" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">BIGSERIAL / UUIDv7: Right-Most Fast-Path Split</text>
  <text x="635" y="282" text-anchor="middle" font-size="11" fill="#14532d">Khóa tăng dần luôn dồn vào trang cực phải (Right-most Leaf)</text>
  <rect x="480" y="295" width="145" height="32" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="552" y="315" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Leaf Cũ: 95-100% Full</text>
  <rect x="645" y="295" width="145" height="32" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="717" y="315" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Leaf Mới: Ghi tiếp</text>
  <text x="635" y="350" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">Occupancy ~95% | Giữ nóng 1 trang cuối trên RAM</text>
</svg>