<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="860" height="410" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Copy-on-Write (CoW) B-Tree vs Lock-Free Bw-Tree (CAS Mapping Table)</text>

  <!-- Left: CoW B-Tree -->
  <rect x="30" y="55" width="390" height="330" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="225" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">1. Copy-on-Write B-Tree (LMDB, ZFS)</text>
  <text x="225" y="100" text-anchor="middle" font-size="11" fill="#475569">Không ghi đè tại chỗ: Nhân bản nhánh từ Leaf lên Root mới</text>

  <rect x="75" y="120" width="115" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="132" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Root V1 (Cũ)</text>

  <rect x="255" y="120" width="125" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="317" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Root V2 (Mới)</text>

  <rect x="55" y="205" width="110" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="229" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Leaf A (Shared)</text>

  <rect x="175" y="205" width="100" height="38" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4,3"/>
  <text x="225" y="229" text-anchor="middle" font-size="12" fill="#64748b">Leaf B (Cũ)</text>

  <rect x="285" y="205" width="110" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="229" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Leaf B' (Mới)</text>

  <!-- Edges -->
  <line x1="120" y1="158" x2="110" y2="205" stroke="#64748b" stroke-width="1.8"/>
  <line x1="145" y1="158" x2="220" y2="205" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4,3"/>
  <line x1="295" y1="158" x2="125" y2="205" stroke="#16a34a" stroke-width="2"/>
  <line x1="330" y1="158" x2="340" y2="205" stroke="#16a34a" stroke-width="2"/>

  <rect x="50" y="268" width="350" height="98" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="225" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Ưu &amp; Nhược điểm của Path Copying:</text>
  <text x="225" y="312" text-anchor="middle" font-size="11" fill="#334155">• Reader đọc Root V1 hoàn toàn Wait-Free (không cần khóa)</text>
  <text x="225" y="332" text-anchor="middle" font-size="11" fill="#334155">• Tức thời có Snapshot &amp; Crash Recovery không cần WAL</text>
  <text x="225" y="352" text-anchor="middle" font-size="11" fill="#b91c1c">• Nhược: Write Amplification lan truyền lên tận Root</text>

  <!-- Right: Bw-Tree -->
  <rect x="440" y="55" width="390" height="330" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="635" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#6b21a8">2. Bw-Tree: Mapping Table + CAS Delta Chain</text>
  <text x="635" y="100" text-anchor="middle" font-size="11" fill="#475569">Chặn lan truyền lên nút cha bằng Logical PID &amp; Compare-And-Swap</text>

  <!-- Mapping Table -->
  <rect x="460" y="122" width="135" height="120" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="527" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#6b21a8">Mapping Table</text>
  <text x="527" y="168" text-anchor="middle" font-size="11" font-family="monospace" fill="#581c87">PID 101 ──► 0x7F10</text>
  <rect x="470" y="180" width="115" height="28" rx="4" fill="#e9d5ff" stroke="#7e22ce"/>
  <text x="527" y="198" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#4c1d95">PID 102 ──► Δ2</text>
  <text x="527" y="226" text-anchor="middle" font-size="11" font-family="monospace" fill="#581c87">PID 103 ──► 0x8A00</text>

  <!-- Delta Chain -->
  <rect x="635" y="120" width="170" height="36" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="720" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Δ2: Delete Key=15</text>

  <rect x="635" y="172" width="170" height="36" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="720" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Δ1: Insert Key=42</text>

  <rect x="635" y="224" width="170" height="42" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="720" y="249" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Base Node (Immutable)</text>

  <path d="M 585 194 C 610 194, 605 138, 635 138" fill="none" stroke="#9333ea" stroke-width="2"/>
  <line x1="720" y1="156" x2="720" y2="172" stroke="#d97706" stroke-width="2"/>
  <line x1="720" y1="208" x2="720" y2="224" stroke="#d97706" stroke-width="2"/>

  <rect x="460" y="280" width="350" height="86" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="635" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Cơ chế Lock-Free CAS &amp; Consolidation:</text>
  <text x="635" y="322" text-anchor="middle" font-size="11" fill="#334155">• Nút cha giữ nguyên PID 102 (không phải cập nhật dây chuyền)</text>
  <text x="635" y="342" text-anchor="middle" font-size="11" fill="#334155">• Khi chuỗi Δ dài &gt; k: Gộp (Consolidate) thành Base Node mới</text>
</svg>