name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Minimal permissions — principle of least privilege
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-flight deploys
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history for accurate git blame / date metadata
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Read version from package.json "packageManager" field
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile: fail if pnpm-lock.yaml is stale → reproducible builds
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.{js,jsx,ts,tsx,mdx}', 'scripts/**/*.{js,ts}', 'tailwind.config.ts', 'next.config.js') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          # Fail on any unhandled warnings during build
          NEXT_TELEMETRY_DISABLED: 1
          # Site & Identity Config
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME }}
          NEXT_PUBLIC_STATUS_LINE: ${{ vars.NEXT_PUBLIC_STATUS_LINE }}
          NEXT_PUBLIC_SITE_DESCRIPTION: ${{ vars.NEXT_PUBLIC_SITE_DESCRIPTION }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          NEXT_PUBLIC_GITHUB_USERNAME: ${{ vars.NEXT_PUBLIC_GITHUB_USERNAME }}
          NEXT_PUBLIC_GITHUB_OWNER: ${{ vars.NEXT_PUBLIC_GITHUB_OWNER }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ vars.NEXT_PUBLIC_GITHUB_REPO }}
          NEXT_PUBLIC_BUTTONDOWN_USERNAME: ${{ vars.NEXT_PUBLIC_BUTTONDOWN_USERNAME }}
          NEXT_PUBLIC_RESUME_URL: ${{ vars.NEXT_PUBLIC_RESUME_URL }}
          NEXT_PUBLIC_GISCUS_REPO: ${{ vars.NEXT_PUBLIC_GISCUS_REPO }}
          NEXT_PUBLIC_GISCUS_REPO_ID: ${{ vars.NEXT_PUBLIC_GISCUS_REPO_ID }}
          NEXT_PUBLIC_GISCUS_CATEGORY: ${{ vars.NEXT_PUBLIC_GISCUS_CATEGORY }}
          NEXT_PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.NEXT_PUBLIC_GISCUS_CATEGORY_ID }}
          # Feature Toggles
          NEXT_PUBLIC_FEATURE_COMMENTS: ${{ vars.NEXT_PUBLIC_FEATURE_COMMENTS }}
          NEXT_PUBLIC_FEATURE_READING_PROGRESS: ${{ vars.NEXT_PUBLIC_FEATURE_READING_PROGRESS }}
          NEXT_PUBLIC_FEATURE_COMMAND_PALETTE: ${{ vars.NEXT_PUBLIC_FEATURE_COMMAND_PALETTE }}
          NEXT_PUBLIC_FEATURE_WEB_VITALS: ${{ vars.NEXT_PUBLIC_FEATURE_WEB_VITALS }}
          NEXT_PUBLIC_FEATURE_BACK_TO_TOP: ${{ vars.NEXT_PUBLIC_FEATURE_BACK_TO_TOP }}
          NEXT_PUBLIC_FEATURE_SHORTCUT_HELP: ${{ vars.NEXT_PUBLIC_FEATURE_SHORTCUT_HELP }}
          NEXT_PUBLIC_FEATURE_FEEDS: ${{ vars.NEXT_PUBLIC_FEATURE_FEEDS }}
          NEXT_PUBLIC_FEATURE_SHARE_BUTTONS: ${{ vars.NEXT_PUBLIC_FEATURE_SHARE_BUTTONS }}
          NEXT_PUBLIC_FEATURE_POST_REACTIONS: ${{ vars.NEXT_PUBLIC_FEATURE_POST_REACTIONS }}
          NEXT_PUBLIC_FEATURE_READING_LIST: ${{ vars.NEXT_PUBLIC_FEATURE_READING_LIST }}
          NEXT_PUBLIC_FEATURE_NOW_PAGE: ${{ vars.NEXT_PUBLIC_FEATURE_NOW_PAGE }}
          NEXT_PUBLIC_FEATURE_CHANGELOG: ${{ vars.NEXT_PUBLIC_FEATURE_CHANGELOG }}
          NEXT_PUBLIC_FEATURE_TAGS_BROWSING: ${{ vars.NEXT_PUBLIC_FEATURE_TAGS_BROWSING }}
          NEXT_PUBLIC_FEATURE_POST_STATS: ${{ vars.NEXT_PUBLIC_FEATURE_POST_STATS }}
          NEXT_PUBLIC_FEATURE_NEWSLETTER: ${{ vars.NEXT_PUBLIC_FEATURE_NEWSLETTER }}
          NEXT_PUBLIC_FEATURE_I18N: ${{ vars.NEXT_PUBLIC_FEATURE_I18N }}
          NEXT_PUBLIC_FEATURE_INTERACTIVE_CODE: ${{ vars.NEXT_PUBLIC_FEATURE_INTERACTIVE_CODE }}
          NEXT_PUBLIC_FEATURE_EDITOR: ${{ vars.NEXT_PUBLIC_FEATURE_EDITOR }}
          NEXT_PUBLIC_FEATURE_STACK: ${{ vars.NEXT_PUBLIC_FEATURE_STACK }}
          NEXT_PUBLIC_FEATURE_SNIPPETS: ${{ vars.NEXT_PUBLIC_FEATURE_SNIPPETS }}
          NEXT_PUBLIC_FEATURE_ADR: ${{ vars.NEXT_PUBLIC_FEATURE_ADR }}
          NEXT_PUBLIC_FEATURE_RELATED_POSTS: ${{ vars.NEXT_PUBLIC_FEATURE_RELATED_POSTS }}
          NEXT_PUBLIC_FEATURE_TABLE_OF_CONTENTS: ${{ vars.NEXT_PUBLIC_FEATURE_TABLE_OF_CONTENTS }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  # Deploy
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Notify newsletter subscribers when new posts are published
  notify-newsletter:
    name: Notify Newsletter
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Notify Buttondown
        run: pnpm notify:newsletter
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          BUTTONDOWN_EMAIL_STATUS: ${{ vars.BUTTONDOWN_EMAIL_STATUS }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME }}

