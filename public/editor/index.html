<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="0; url=/en/editor/" />
    <title>Redirecting to Editor...</title>
  </head>
  <body>
    <script>
      try {
        const lang = localStorage.getItem('blog_editor_lang') || 'en';
        window.location.replace('/' + (lang === 'vi' ? 'vi' : 'en') + '/editor/');
      } catch (e) {
        window.location.replace('/en/editor/');
      }
    </script>
    <p>Redirecting to <a href="/en/editor/">/en/editor/</a>...</p>
  </body>
</html>
